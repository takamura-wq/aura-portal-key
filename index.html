<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURA PORTAL | Web Key Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'] 
                    },
                    colors: { 
                        cyber: { 400: '#c084fc', 500: '#a855f7', 600: '#9333ea', dark: '#050508' },
                        neon: { green: '#4ade80', yellow: '#facc15' }
                    },
                    animation: { 
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, filter: 'drop-shadow(0 0 15px rgba(74, 222, 128, 0.6))' },
                            '50%': { opacity: .8, filter: 'drop-shadow(0 0 5px rgba(74, 222, 128, 0.3))' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030305; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        .bg-ambient { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 60%); z-index: -2; pointer-events: none; }
        .bg-grid { position: fixed; inset: 0; background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); z-index: -3; mask-image: radial-gradient(circle at center, black 30%, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%); }

        .glass-panel { background: rgba(10, 10, 14, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); }
        
        .btn-copy { background: linear-gradient(135deg, #a855f7, #9333ea); color: #ffffff; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); transition: all 0.3s; }
        .btn-copy:hover { box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6); transform: translateY(-2px); filter: brightness(1.1); }
        .btn-copy:active { transform: translateY(1px) scale(0.98); }

        .key-display { background: rgba(0, 0, 0, 0.6); border: 1px dashed rgba(168, 85, 247, 0.5); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }

        /* Toast Notification */
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: rgba(16, 185, 129, 0.9); backdrop-filter: blur(8px); color: white; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 999; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2); pointer-events: none;}
        .toast.show { bottom: 30px; }
        
        /* Label Sangat Mencolok */
        .badge-mencolok {
            background: linear-gradient(90deg, #16a34a, #22c55e);
            color: #000;
            border: 2px solid #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.5), inset 0 0 10px rgba(255,255,255,0.5);
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }
    </style>
</head>

<body class="flex justify-center items-center h-screen relative">
    <div class="bg-ambient"></div>
    <div class="bg-grid"></div>

    <div class="w-full max-w-[400px] p-5 z-10">
        <div class="glass-panel rounded-3xl p-7 text-center relative overflow-hidden">
            <!-- Dekorasi Atas -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-cyber-400 to-transparent opacity-70"></div>
            
            <div class="w-16 h-16 mx-auto rounded-2xl bg-cyber-500/10 border border-cyber-500/30 flex items-center justify-center text-cyber-400 text-3xl mb-4 shadow-[0_0_20px_rgba(168,85,247,0.2)]">
                <i class="fas fa-shield-halved"></i>
            </div>
            
            <h1 class="font-extrabold text-white text-xl tracking-tight mb-1">SYSTEM UNLOCKED</h1>
            <p class="text-xs text-slate-400 mb-6">Akses rahasia berhasil didapatkan.</p>

            <!-- Container Sukses (Jika ada Key) -->
            <div id="key-container" class="hidden flex flex-col items-center">
                
                <!-- LABEL MENGGUNAKAN DESAIN MENGKILAP DAN MENCOLOK -->
                <div id="vid-label" class="badge-mencolok animate-pulse-glow px-5 py-1.5 rounded-full font-extrabold text-sm tracking-widest uppercase mb-4 flex items-center gap-2 relative z-10">
                    <i class="fas fa-key text-black"></i> KEY: -
                </div>

                <div class="w-full key-display rounded-2xl p-5 mb-5 relative group">
                    <div class="text-[10px] text-cyber-400 font-bold tracking-widest uppercase mb-2">Password Anda:</div>
                    <div id="key-text" class="font-mono text-2xl font-extrabold text-white tracking-widest break-all">
                        ----
                    </div>
                </div>

                <button onclick="copyKey()" class="w-full py-4 btn-copy rounded-xl text-sm font-extrabold flex items-center justify-center gap-2 uppercase tracking-wide">
                    <i class="fas fa-copy text-lg"></i> Salin Key
                </button>
                
                <p class="text-[10px] text-slate-500 mt-4 leading-relaxed">
                    Kembali ke web <b class="text-cyber-400">Aura Portal</b> dan paste password ini pada brankas video yang sesuai.
                </p>
            </div>

            <!-- Container Error (Jika diakses tanpa URL parameter) -->
            <div id="error-container" class="hidden">
                <div class="w-16 h-16 mx-auto rounded-full bg-red-500/10 flex items-center justify-center text-red-500 text-3xl mb-4 border border-red-500/20">
                    <i class="fas fa-triangle-exclamation"></i>
                </div>
                <h2 class="text-white font-bold text-lg mb-2">Akses Ditolak</h2>
                <p class="text-sm text-slate-400 mb-5">Key tidak ditemukan. Harap akses halaman ini melalui link Bicolink yang valid dari Aura Portal.</p>
            </div>

        </div>
    </div>

    <!-- Toast Component -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle text-lg"></i> 
        <span>Berhasil Disalin!</span>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Mengambil parameter dari URL
            const params = new URLSearchParams(window.location.search);
            const key = params.get('key');
            
            // Mengambil vid (jika tidak ada akan pakai tulisan DEFAULT)
            const vid = params.get('vid') || 'TIDAK DIKETAHUI';
            
            const keyContainer = document.getElementById('key-container');
            const errorContainer = document.getElementById('error-container');
            const keyText = document.getElementById('key-text');
            const vidLabel = document.getElementById('vid-label');
            
            if (key) {
                // Tampilkan container sukses
                keyContainer.classList.remove('hidden');
                keyText.innerText = key;
                
                // Set teks label mencolok menjadi KEY: (Nama Video)
                vidLabel.innerHTML = `<i class="fas fa-key text-black/80"></i> KEY: ${vid}`;
            } else {
                // Tampilkan error jika dibuka langsung tanpa link dari bicolink
                errorContainer.classList.remove('hidden');
                document.querySelector('.fa-shield-halved').parentElement.classList.add('hidden');
                document.querySelector('h1').classList.add('hidden');
                document.querySelector('p').classList.add('hidden');
            }
        });

        function copyKey() {
            const keyString = document.getElementById('key-text').innerText;
            
            // Method 1: Clipboard API Modern
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(keyString).then(showToast);
            } else {
                // Method 2: Fallback jadul (execCommand) untuk HP/Browser lama
                const textArea = document.createElement("textarea");
                textArea.value = keyString;
                textArea.style.position = "absolute";
                textArea.style.left = "-999999px";
                document.body.prepend(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (error) {
                    console.error('Copy failed', error);
                } finally {
                    textArea.remove();
                }
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            // Hilangkan toast setelah 3 detik
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
