<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURA PORTAL | Akses Key</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { cyber: { 400: '#c084fc', 500: '#a855f7', 600: '#9333ea', dark: '#050508' } },
                    animation: { 
                        'fade-up': 'fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'bounce-slight': 'bounceSlight 2s infinite ease-in-out'
                    },
                    keyframes: {
                        fadeUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        bounceSlight: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-5px)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030305; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; }
        
        .bg-ambient { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 70%); z-index: -2; pointer-events: none; }
        .bg-grid { position: fixed; inset: 0; background-size: 30px 30px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); z-index: -3; mask-image: linear-gradient(to bottom, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); }

        .glass-panel { background: rgba(10, 10, 14, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }

        .btn-primary { background: linear-gradient(135deg, #a855f7, #9333ea); color: #ffffff; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); transition: all 0.3s; }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5); transform: translateY(-2px); filter: brightness(1.1); }
        .btn-primary:active { transform: translateY(1px) scale(0.98); }

        .key-box { background: rgba(0, 0, 0, 0.4); border: 1px dashed rgba(168, 85, 247, 0.5); text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); position: relative; overflow: hidden; }
        .key-box::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent); transform: skewX(-20deg); animation: shine 3s infinite; }
        
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* Custom Toast */
        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #16a34a; color: white; padding: 12px 24px; border-radius: 50px; font-size: 12px; font-weight: bold; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.4); transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; display: flex; align-items: center; gap: 8px; }
        #toast.show { bottom: 30px; }
    </style>
</head>

<body class="items-center justify-center">
    <div class="bg-ambient"></div>
    <div class="bg-grid"></div>

    <div class="w-full max-w-[400px] px-5 relative z-10 animate-fade-up">
        
        <!-- Header Logo -->
        <div class="flex justify-center items-center gap-3 mb-8 animate-bounce-slight">
            <div class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-cyber-400 shadow-inner shadow-cyber-500/20">
                <i class="fas fa-key text-xl"></i>
            </div>
            <div class="flex flex-col">
                <h1 class="font-extrabold text-white text-xl tracking-tight leading-none">AURA PORTAL</h1>
                <span class="text-[10px] text-cyber-400 mt-1 font-bold tracking-widest uppercase">VIP Key Generator</span>
            </div>
        </div>

        <!-- Main Card -->
        <div class="glass-panel p-6 sm:p-8 rounded-[24px] border-t-2 border-t-cyber-500 text-center relative overflow-hidden">
            <!-- Glow effect top -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-cyber-500 blur-md"></div>

            <div id="loading-state" class="py-10 flex flex-col items-center">
                <i class="fas fa-circle-notch fa-spin text-cyber-400 text-3xl mb-4"></i>
                <p class="text-sm text-slate-400">Mengekstrak kunci...</p>
            </div>

            <div id="success-state" class="hidden flex-col items-center">
                <div class="w-16 h-16 rounded-full bg-green-500/10 border border-green-500/30 flex items-center justify-center text-green-400 text-2xl mb-4">
                    <i class="fas fa-check"></i>
                </div>
                <h2 class="text-white font-bold text-lg">Akses Diberikan</h2>
                
                <!-- Target Video Identifier -->
                <div id="vid-badge" class="mt-2 mb-5 hidden">
                    <span class="bg-cyber-500/10 border border-cyber-500/30 text-cyber-400 text-[10px] font-bold px-3 py-1 rounded-full flex items-center gap-1.5">
                        <i class="fas fa-film"></i> <span id="vid-text">Video</span>
                    </span>
                </div>

                <p class="text-xs text-slate-400 mb-3">Salin key di bawah ini untuk membuka brankas.</p>

                <!-- The Key -->
                <div class="w-full key-box p-4 rounded-xl mb-5">
                    <span id="key-display" class="font-mono text-2xl font-bold text-white tracking-[0.2em]"></span>
                </div>

                <button onclick="copyKey()" class="w-full btn-primary py-3.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
                    <i class="fas fa-copy"></i> SALIN KEY SEKARANG
                </button>
            </div>

            <div id="error-state" class="hidden flex-col items-center py-5">
                <div class="w-16 h-16 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-400 text-2xl mb-4">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h2 class="text-white font-bold text-lg mb-2">Akses Ditolak</h2>
                <p class="text-xs text-slate-400 bg-white/5 p-3 rounded-lg border border-white/5 leading-relaxed">
                    Key tidak ditemukan. Harap pastikan Anda mengakses halaman ini melalui link resmi dari Bicolink / YouTube.
                </p>
            </div>
        </div>

        <p class="text-center text-[10px] text-slate-500 font-mono tracking-widest mt-8">
            SECURE CONNECTION <i class="fas fa-lock ml-1 text-cyber-500/50"></i>
        </p>
    </div>

    <!-- Toast Notification -->
    <div id="toast">
        <i class="fas fa-check-circle"></i> Berhasil disalin ke clipboard!
    </div>

    <script>
        // Simulasi loading kecil agar terkesan "memproses"
        setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const keyParam = urlParams.get('key');
            const vidParam = urlParams.get('vid');

            document.getElementById('loading-state').classList.add('hidden');

            if (keyParam) {
                // Tampilkan Key
                document.getElementById('success-state').classList.remove('hidden');
                document.getElementById('success-state').classList.add('flex');
                document.getElementById('key-display').innerText = keyParam;

                // Jika ada parameter vid (contoh: ?vid=Private 01)
                if (vidParam) {
                    const vidBadge = document.getElementById('vid-badge');
                    const vidText = document.getElementById('vid-text');
                    vidBadge.classList.remove('hidden');
                    vidText.innerText = `Untuk: ${vidParam}`;
                }
            } else {
                // Tampilkan Error jika tidak ada key
                document.getElementById('error-state').classList.remove('hidden');
                document.getElementById('error-state').classList.add('flex');
            }
        }, 800); // loading 0.8 detik

        function copyKey() {
            const keyText = document.getElementById('key-display').innerText;
            
            // Mencoba menggunakan Clipboard API modern
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(keyText).then(showToast);
            } else {
                // Fallback untuk browser lama / environment iframe
                let textArea = document.createElement("textarea");
                textArea.value = keyText;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Gagal menyalin', err);
                }
                textArea.remove();
            }
        }

        let toastTimeout;
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000); // Hilang dalam 3 detik
        }
    </script>
</body>
</html>
